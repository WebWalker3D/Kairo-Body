name: Callback safety regressions

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: callback-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Exercise callback and cancellation boundaries
        run: |
          set -o pipefail
          simulator_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for group in devices.values() for d in group if d["name"].startswith("iPad") and d["state"] == "Shutdown"))')
          xcrun simctl boot "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b
          xcodebuild test \
            -project KairoBody.xcodeproj -scheme KairoBody \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -parallel-testing-enabled NO -destination-timeout 90 \
            -only-testing:KairoBodyTests/PingCallbackTests \
            -only-testing:KairoBodyTests/ObservationDeliveryTests \
            -only-testing:KairoBodyTests/BodyCommandCancellationTests \
            -only-testing:KairoBodyTests/SpeechStartupCancellationTests \
            -only-testing:KairoBodyTests/MicrophoneInputTests \
            -only-testing:KairoBodyTests/SelfHealingTests \
            -resultBundlePath build/CallbackSafety.xcresult \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CallbackSafety-results
          path: build/CallbackSafety.xcresult
          if-no-files-found: warn
