name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ipad-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Refuse personal provisioning in public builds
        run: |
          python3 - <<'PY'
          import re, sys
          from pathlib import Path
          # Public CI must never carry credentials or personal session ids,
          # in the tree or in what XcodeGen would bake into Info.plist.
          problems = []
          project = Path("project.yml").read_text()
          for key in ("KairoSensoryToken", "KairoAgentToken", "KairoEchoSessionID"):
              match = re.search(rf"^\s*{key}: \"(.*?)\"\s*$", project, re.MULTILINE)
              if match and match.group(1):
                  problems.append(f"{key} carries a value in the public tree")
          if re.search(r"session_[0-9a-f]{16,}", project):
              problems.append("a session identifier appears in project.yml")
          for swift in Path("KairoBody").glob("*.swift"):
              text = swift.read_text()
              for match in re.finditer(r"(kbp_|kbc_|kbr_|sess_)[A-Za-z0-9_-]{20,}", text):
                  problems.append(f"{swift.name} appears to embed {match.group(0)[:12]}…")
              if re.search(r"session_[0-9a-f]{24,}", text):
                  problems.append(f"{swift.name} embeds a personal session id")
          if problems:
              print("\n".join(problems)); sys.exit(1)
          print("Public-provisioning guard: clean")
          PY
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Run the full unit suite on an iPad simulator
        run: |
          set -o pipefail
          simulator_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for group in devices.values() for d in group if d["name"].startswith("iPad") and d["state"] == "Shutdown"))')
          xcrun simctl boot "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b
          xcodebuild test \
            -project KairoBody.xcodeproj \
            -scheme KairoBody \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -parallel-testing-enabled NO \
            -destination-timeout 90 \
            -only-testing:KairoBodyTests -only-testing:KairoBodyUITests \
            -resultBundlePath build/Tests.xcresult \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/kairo-body-xctest.log
      - name: Export interface journey screenshots
        if: always()
        run: |
          if [ -d build/Tests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/Tests.xcresult --output-path visual-journey
          fi
      - name: Upload interface journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KairoBody-interface-journey
          path: visual-journey
          if-no-files-found: warn
      - name: Capture iPad body visual smoke screenshots
        run: |
          simulator_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=[d for group in json.load(sys.stdin)["devices"].values() for d in group if d["name"].startswith("iPad")]; print(next((d["udid"] for d in devices if d["state"] == "Booted"), devices[0]["udid"]))')
          simulator_state=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; uid=sys.argv[1]; print(next(d["state"] for group in json.load(sys.stdin)["devices"].values() for d in group if d["udid"] == uid))' "$simulator_id")
          if [ "$simulator_state" != "Booted" ]; then xcrun simctl boot "$simulator_id"; fi
          xcrun simctl bootstatus "$simulator_id" -b
          xcrun simctl install "$simulator_id" "build/Build/Products/Debug-iphonesimulator/KairoBody.app"
          xcrun simctl launch "$simulator_id" icu.kairo.body
          sleep 2
          xcrun simctl io "$simulator_id" screenshot KairoBody-setup.png
          xcrun simctl terminate "$simulator_id" icu.kairo.body || true
          # A fresh install opens on the setup sheet; defer it exactly like the
          # "Not now" button does so the second capture shows the living stage.
          xcrun simctl spawn "$simulator_id" defaults write icu.kairo.body setupDeferred -bool true
          xcrun simctl launch "$simulator_id" icu.kairo.body
          sleep 4
          xcrun simctl io "$simulator_id" screenshot KairoBody-stage.png
          xcrun simctl io "$simulator_id" recordVideo --codec=h264 KairoBody-motion.mp4 &
          recording_pid=$!
          sleep 8
          kill -INT "$recording_pid"
          wait "$recording_pid" || true
          xcrun simctl terminate "$simulator_id" icu.kairo.body
          xcrun swift scripts/compress_preview.swift KairoBody-motion.mp4 KairoBody-motion-preview.mp4
      - name: Upload visual smoke screenshots
        uses: actions/upload-artifact@v4
        with:
          name: KairoBody-simulator-preview
          path: |
            KairoBody-setup.png
            KairoBody-stage.png
            KairoBody-motion-preview.mp4
          if-no-files-found: error
      - name: Build unsigned device app
        run: |
          xcodebuild \
            -project KairoBody.xcodeproj \
            -scheme KairoBody \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/KairoBody.app Payload/
          zip -qry KairoBody.ipa Payload
      - name: Check packaged iPad permissions and version
        run: |
          python3 - <<'PY'
          import plistlib
          from zipfile import ZipFile
          with ZipFile('KairoBody.ipa') as archive:
              info = plistlib.loads(archive.read('Payload/KairoBody.app/Info.plist'))
          assert info['CFBundleIdentifier'] == 'icu.kairo.body'
          assert info['CFBundleVersion'] == '65'
          assert info['CFBundleShortVersionString'] == '3.5.1'
          assert info['CFBundleIcons']['CFBundlePrimaryIcon']['CFBundleIconFiles']
          assert 'Payload/KairoBody.app/Assets.car' in archive.namelist()
          assert info['NSCameraUsageDescription']
          assert info['NSMicrophoneUsageDescription']
          assert info['NSSpeechRecognitionUsageDescription']
          assert info['NSLocationWhenInUseUsageDescription']
          assert info['NSLocalNetworkUsageDescription']
          assert info['UIDeviceFamily'] == [2]
          # Public artifacts must carry no personal provisioning.
          for key in ('KairoSensoryToken', 'KairoAgentToken', 'KairoEchoSessionID'):
              assert not str(info.get(key) or '').strip(), f'{key} is baked into a public artifact'
          print('Packaged', info['CFBundleIdentifier'], info['CFBundleShortVersionString'],
                'build', info['CFBundleVersion'], '- no personal provisioning')
          PY
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: KairoBody-unsigned-ipa
          path: KairoBody.ipa
          if-no-files-found: error
