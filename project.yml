name: KairoBody
options:
  bundleIdPrefix: icu.kairo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_BITCODE: NO
targets:
  KairoBody:
    type: application
    platform: iOS
    sources:
      - path: KairoBody
    info:
      path: KairoBody/Info.plist
      properties:
        CFBundleDisplayName: Kairo Body
        CFBundleShortVersionString: "2.0.5"
        CFBundleVersion: "55"
        # Public builds carry no personal provisioning. These keys stay empty
        # in the repository; credentials come from on-device setup and the
        # Echo endpoint id falls back to the constant in AppConfig.
        KairoSensoryToken: ""
        KairoAgentToken: ""
        KairoEchoSessionID: ""
        KairoEchoEndpointID: ""
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: Kairo uses location only when you enable location sensing, so the body can report bounded movement and position observations.
        NSCameraUsageDescription: Kairo uses one-shot front-camera photos for shared vision and checks front-camera motion locally to dim and wake the display. Motion video is never sent.
        NSMicrophoneUsageDescription: Kairo listens for the name Kairo while voice wake is enabled, then sends recognized request text to Kairo.
        NSSpeechRecognitionUsageDescription: Kairo recognizes the name Kairo and your spoken request so Kairo can reply in text and voice.
        NSLocalNetworkUsageDescription: Kairo may connect to a Kairo server on your local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: icu.kairo.body
        PRODUCT_NAME: KairoBody
        PRODUCT_MODULE_NAME: KairoBody
        MARKETING_VERSION: 2.0.5
        CURRENT_PROJECT_VERSION: 55
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
  KairoBodyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: KairoBody
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: icu.kairo.body.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/KairoBody.app/KairoBody"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  KairoBody:
    build:
      targets:
        KairoBody: all
        KairoBodyTests: [test]
    test:
      targets:
        - KairoBodyTests
    run:
      config: Debug
    archive:
      config: Release
