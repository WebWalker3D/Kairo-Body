name: KairoBody
options:
  bundleIdPrefix: icu.kairo
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  KairoBody:
    type: application
    platform: iOS
    sources:
      - KairoBody
    info:
      path: KairoBody/Info.plist
      properties:
        CFBundleDisplayName: Kairo Body
        CFBundleShortVersionString: "1.0.35"
        CFBundleVersion: "37"
        KairoEchoSessionID: ""
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: Kairo Body uses location only when you enable location sensing, so the body can report bounded movement and position observations.
        NSCameraUsageDescription: Kairo Body uses one-shot photos for Kairo vision and checks front camera motion locally to dim and wake the display. Motion video is never sent.
        NSMicrophoneUsageDescription: Kairo Body listens for the name Kairo while voice wake is enabled, then sends recognized request text to Kairo.
        NSSpeechRecognitionUsageDescription: Kairo Body recognizes the name Kairo and your spoken request so Kairo can reply in text and voice.
        NSLocalNetworkUsageDescription: Kairo Body may connect to a Kairo server on your local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: icu.kairo.body
        PRODUCT_NAME: Kairo Body
        PRODUCT_MODULE_NAME: KairoBody
        MARKETING_VERSION: 1.0.35
        CURRENT_PROJECT_VERSION: 37
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - KairoBodyTests
  KairoBodyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - tests/MemoryProposalTests.swift
      - tests/InvitationTests.swift
      - tests/SurfaceDeliveryClientTests.swift
      - tests/PrivateBodyClientTests.swift
      - tests/BodyActionLifecycleTests.swift
      - tests/SharedVisualContextTests.swift
      - tests/ContactIntentTests.swift
      - tests/LocationAttentionTests.swift
      - tests/BodyCommandTests.swift
      - tests/BodyCapabilitiesTests.swift
      - tests/CameraCaptureServiceTests.swift
      - tests/MotionDimmingTests.swift
      - tests/BodyExpressionPaletteTests.swift
      - tests/ConversationClientTests.swift
      - tests/EchoIntegrationTests.swift
      - tests/SpeechServiceTests.swift
      - tests/WakePhraseTests.swift
      - tests/ReliabilityTests.swift
      - tests/JobTrackingTests.swift
      - tests/BodyLinkTests.swift
      - tests/ConversationReliabilityTests.swift
    dependencies:
      - target: KairoBody
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: icu.kairo.body.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Kairo Body.app/Kairo Body"
